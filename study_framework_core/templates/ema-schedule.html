<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Framework - EMA Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --border-radius: 12px;
            --box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --box-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background: var(--light-bg);
            color: var(--gray-800);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        .navbar {
            background: var(--white) !important;
            border-bottom: 1px solid var(--gray-200);
            box-shadow: var(--box-shadow);
        }

        .main-container {
            padding: 2rem 0;
        }

        .content-section {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--gray-200);
        }

        .section-title {
            color: var(--gray-900);
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: var(--gray-50);
            color: var(--gray-700);
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .table tbody tr {
            transition: background-color 0.2s ease;
            border-bottom: 1px solid var(--gray-100);
        }

        .table tbody tr:hover {
            background: var(--gray-50);
        }

        .table tbody tr:last-child {
            border-bottom: none;
        }

        .table tbody td {
            border: none;
            vertical-align: middle;
            padding: 1rem;
            color: var(--gray-700);
            font-weight: 500;
        }

        .btn-action {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--secondary-color);
            color: white;
            text-decoration: none;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger-color);
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-refresh {
            background: var(--warning-color);
        }

        .btn-refresh:hover {
            background: #b45309;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            padding: 0.75rem;
            color: var(--gray-700);
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--success-color) 0%, #20c997 100%);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            color: white;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: linear-gradient(135deg, var(--success-color) 0%, #20c997 100%);
            color: white;
        }

        .status-inactive {
            background: linear-gradient(135deg, var(--danger-color) 0%, #e83e8c 100%);
            color: white;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    {% include 'navigation.html' %}

    <!-- Main Content -->
    <div class="container main-container">
        <!-- Header -->
        <div class="content-section">
            <h1 class="section-title">
                <i class="fas fa-calendar-alt me-2"></i>EMA Schedule Management
            </h1>
            <p class="text-muted">Manage EMA surveys and schedules for study participants.</p>
        </div>

        <!-- User Dashboard -->
        <div class="content-section">
            <h2 class="section-title">
                <i class="fas fa-users me-2"></i>User Status Dashboard
            </h2>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th><i class="fas fa-user me-1"></i>Username</th>
                            <th><i class="fas fa-info-circle me-1"></i>Status</th>
                            <th><i class="fas fa-cogs me-1"></i>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <!-- User data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Replace EMA -->
        <div class="content-section">
            <h2 class="section-title">
                <i class="fas fa-exchange-alt me-2"></i>Replace EMA Schedule
            </h2>
            <form id="replaceEmaForm" class="row g-3">
                <div class="col-md-4">
                    <label for="userSelect" class="form-label">Select User</label>
                    <select id="userSelect" class="form-select" required>
                        <option value="">Choose user...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="fileReplace" class="form-label">EMA File</label>
                    <input type="file" id="fileReplace" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="replacePasskey" class="form-label">Passkey</label>
                    <input type="password" id="replacePasskey" class="form-control" placeholder="Enter passkey"
                        required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-submit">
                        <i class="fas fa-upload me-1"></i>Replace EMA Schedule
                    </button>
                </div>
            </form>
        </div>

        <!-- Add New User -->
        <div class="content-section">
            <h2 class="section-title">
                <i class="fas fa-user-plus me-2"></i>Add New User
            </h2>
            <form id="addUserForm" class="row g-3">
                <div class="col-md-4">
                    <label for="newUserName" class="form-label">Username</label>
                    <input type="text" id="newUserName" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="col-md-4">
                    <label for="fileAdd" class="form-label">EMA File</label>
                    <input type="file" id="fileAdd" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="addUserPasskey" class="form-label">Passkey</label>
                    <input type="password" id="addUserPasskey" class="form-control" placeholder="Enter passkey"
                        required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-submit">
                        <i class="fas fa-plus me-1"></i>Add New User
                    </button>
                </div>
            </form>
        </div>

        <!-- Schedule EMA -->
        <div class="content-section">
            <h2 class="section-title">
                <i class="fas fa-clock me-2"></i>Schedule EMA
            </h2>
            <form id="scheduleEmaForm" class="row g-3">
                <div class="col-md-3">
                    <label for="scheduleUserSelect" class="form-label">Select User</label>
                    <select id="scheduleUserSelect" class="form-select" required>
                        <option value="">Choose user...</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="scheduleFile" class="form-label">EMA File</label>
                    <input type="file" id="scheduleFile" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="scheduleDateTime" class="form-label">Schedule Date & Time</label>
                    <input type="datetime-local" id="scheduleDateTime" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="schedulePasskey" class="form-label">Passkey</label>
                    <input type="password" id="schedulePasskey" class="form-control" placeholder="Enter passkey"
                        required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-submit">
                        <i class="fas fa-calendar-plus me-1"></i>Schedule EMA
                    </button>
                </div>
            </form>
        </div>

        <!-- Scheduled EMAs -->
        <div class="content-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="section-title mb-0">
                    <i class="fas fa-list-ul me-2"></i>Scheduled EMAs
                </h2>
                <button onclick="refreshScheduledEmas()" class="btn btn-action btn-refresh">
                    <i class="fas fa-sync-alt me-1"></i>Refresh
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th><i class="fas fa-user me-1"></i>User</th>
                            <th><i class="fas fa-calendar me-1"></i>Scheduled Time</th>
                            <th><i class="fas fa-clock me-1"></i>Created Time</th>
                            <th><i class="fas fa-info-circle me-1"></i>Status</th>
                            <th><i class="fas fa-cogs me-1"></i>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="scheduledEmaTable">
                        <!-- Scheduled EMAs will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display scheduled EMAs
        function fetchScheduledEmas() {
            fetch('/internal_web/ema-schedule/scheduled')
                .then(response => response.json())
                .then(scheduledEmas => {
                    const table = document.getElementById('scheduledEmaTable');
                    table.innerHTML = '';

                    if (scheduledEmas.length === 0) {
                        table.innerHTML = '<tr><td colspan="5" style="text-align: center;">No scheduled EMAs</td></tr>';
                        return;
                    }

                    scheduledEmas.forEach(ema => {
                        let statusColor, statusCircle, actionButton, rowStyle = '';

                        // Set status color, action button, and styling based on status
                        switch (ema.status) {
                            case 'pending':
                                statusColor = 'yellow';
                                actionButton = `<button class="btn btn-action btn-danger btn-sm" onclick="cancelScheduledEma('${ema.user}', '${ema.filename}')"><i class="fas fa-times me-1"></i>Cancel</button>`;
                                break;
                            case 'completed':
                                statusColor = 'green';
                                actionButton = '<span style="color: gray;">—</span>';
                                rowStyle = 'background-color: #e8f5e9; opacity: 0.8;';
                                break;
                            case 'failed':
                                statusColor = 'red';
                                actionButton = `<button class="btn btn-action btn-danger btn-sm" onclick="cancelScheduledEma('${ema.user}', '${ema.filename}')"><i class="fas fa-times me-1"></i>Cancel</button>`;
                                rowStyle = 'background-color: #fff3e0;';
                                break;
                            case 'cancelled':
                                statusColor = 'orange';
                                actionButton = '<span style="color: gray;">—</span>';
                                rowStyle = 'background-color: #f5f5f5; opacity: 0.7;';
                                break;
                        }

                        statusCircle = `<span style="display: inline-block; width: 10px; height: 10px; background-color: ${statusColor}; border-radius: 50%; margin-right: 8px;"></span>`;

                        const row = document.createElement('tr');
                        row.style.cssText = rowStyle;

                        row.innerHTML = `
                            <td>${ema.user}</td>
                            <td>${ema.scheduled_time}</td>
                            <td>${ema.created_time}</td>
                            <td>${statusCircle}${ema.status}</td>
                            <td>${actionButton}</td>
                        `;
                        table.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error fetching scheduled EMAs:', error);
                });
        }

        // Refresh scheduled EMAs manually
        function refreshScheduledEmas() {
            fetchScheduledEmas();
        }

        // Cancel a scheduled EMA
        function cancelScheduledEma(user, filename) {
            if (!confirm(`Are you sure you want to cancel the scheduled EMA for ${user}?`)) {
                return;
            }

            const password = prompt('Enter password:');
            if (!password) return;

            fetch(`/internal_web/ema-schedule/scheduled/${user}/${filename}?password=${password}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message || data.error);
                    fetchScheduledEmas();
                })
                .catch(error => {
                    alert('Error cancelling scheduled EMA: ' + error);
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userTable = document.getElementById('userTable');
            const userSelect = document.getElementById('userSelect');
            const scheduleUserSelect = document.getElementById('scheduleUserSelect');

            // Fetch users and populate table and dropdown
            function fetchUsers() {
                fetch('/internal_web/ema-schedule/users')
                    .then(response => response.json())
                    .then(users => {
                        userTable.innerHTML = '';
                        userSelect.innerHTML = '';
                        scheduleUserSelect.innerHTML = '';
                        users.forEach(user => {
                            // Determine status circle color
                            const statusCircle = user.status === 'active'
                                ? `<span style="display: inline-block; width: 10px; height: 10px; background-color: green; border-radius: 50%;"></span>`
                                : `<span style="display: inline-block; width: 10px; height: 10px; background-color: red; border-radius: 50%;"></span>`;

                            // Populate table
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${user.name}</td>
                                <td>${statusCircle} ${user.status}</td>
                                <td><button class="btn btn-action btn-sm" onclick="downloadEma('${user.name}')"><i class="fas fa-download me-1"></i>Download</button></td>
                            `;
                            userTable.appendChild(row);

                            // Populate dropdowns
                            const option = document.createElement('option');
                            option.value = user.name;
                            option.textContent = user.name;
                            userSelect.appendChild(option);

                            const scheduleOption = document.createElement('option');
                            scheduleOption.value = user.name;
                            scheduleOption.textContent = user.name;
                            scheduleUserSelect.appendChild(scheduleOption);
                        });
                    });
            }

            // Download EMA
            window.downloadEma = function (username) {
                window.location.href = `/internal_web/ema-schedule/download/${username}`;
            };

            // Replace EMA
            document.getElementById('replaceEmaForm').addEventListener('submit', event => {
                event.preventDefault();
                const formData = new FormData();
                formData.append('user', userSelect.value);
                formData.append('file', document.getElementById('fileReplace').files[0]);
                formData.append('password', document.getElementById('replacePasskey').value);

                fetch('/internal_web/ema-schedule/replace-ema', {
                    method: 'POST',
                    body: formData,
                })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message || data.error);
                        fetchUsers();
                    });
            });

            // Add User
            document.getElementById('addUserForm').addEventListener('submit', event => {
                event.preventDefault();
                const formData = new FormData();
                formData.append('user', document.getElementById('newUserName').value);
                formData.append('file', document.getElementById('fileAdd').files[0]);
                formData.append('password', document.getElementById('addUserPasskey').value);

                fetch('/internal_web/ema-schedule/add-user', {
                    method: 'POST',
                    body: formData,
                })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message || data.error);
                        fetchUsers();
                    });
            });

            // Schedule EMA
            document.getElementById('scheduleEmaForm').addEventListener('submit', event => {
                event.preventDefault();
                const formData = new FormData();
                formData.append('user', scheduleUserSelect.value);
                formData.append('file', document.getElementById('scheduleFile').files[0]);
                formData.append('datetime', document.getElementById('scheduleDateTime').value);
                formData.append('password', document.getElementById('schedulePasskey').value);

                fetch('/internal_web/ema-schedule/schedule-ema', {
                    method: 'POST',
                    body: formData,
                })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message || data.error);
                        fetchUsers();
                        fetchScheduledEmas();

                        // Clear form fields after successful submission
                        if (data.message && !data.error) {
                            scheduleUserSelect.value = '';
                            document.getElementById('scheduleFile').value = '';
                            document.getElementById('scheduleDateTime').value = '';
                            document.getElementById('schedulePasskey').value = '';
                        }
                    });
            });

            fetchScheduledEmas();

            // Periodic polling to refresh user data
            function startPolling(interval = 600000) { // 10 minutes
                setInterval(fetchUsers, interval);
            }

            // Initial fetch and polling
            fetchUsers();
            startPolling();

        });
    </script>
</body>

</html>
